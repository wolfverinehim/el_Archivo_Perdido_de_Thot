<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sanctumBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a10;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5a3a20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1a00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo oscuro del santuario -->
  <rect width="800" height="400" fill="url(#sanctumBg)"/>
  
  <!-- Triángulos dorados en las paredes (referencia piramidal) -->
  <g opacity="0.15" fill="#d4af37">
    <polygon points="50,50 150,150 50,250"/>
    <polygon points="750,50 650,150 750,250"/>
    <polygon points="200,400 400,200 600,400"/>
  </g>
  
  <!-- Sarcófago central -->
  <g filter="url(#glow)">
    <!-- Cuerpo del sarcófago -->
    <path d="M 250 150 L 320 140 L 480 140 L 550 150 L 550 320 Q 550 340 530 340 L 270 340 Q 250 340 250 320 Z" 
          fill="#8b7355" stroke="#d4af37" stroke-width="3"/>
    
    <!-- Decoración frontal del sarcófago -->
    <g opacity="0.8">
      <rect x="280" y="160" width="240" height="160" fill="none" stroke="#d4af37" stroke-width="2" rx="3"/>
      <circle cx="400" cy="220" r="35" fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M 380 220 L 420 220 M 400 200 L 400 240" stroke="#d4af37" stroke-width="1.5"/>
    </g>
    
    <!-- Figura del faraón en relieve -->
    <g opacity="0.7">
      <circle cx="400" cy="190" r="25" fill="#c4a57b" stroke="#8b6f47" stroke-width="2"/>
      <path d="M 375 215 L 360 260 L 380 260 L 385 235 L 400 230 L 415 235 L 420 260 L 440 260 L 425 215 Z" 
            fill="#c4a57b" stroke="#8b6f47" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Trono real (lado izquierdo) -->
  <g opacity="0.7">
    <rect x="80" y="180" width="100" height="80" fill="#8b6f47" stroke="#6b4f27" stroke-width="2" rx="5"/>
    <polygon points="80,180 60,160 80,160" fill="#7a5f37"/>
    <polygon points="180,180 200,160 180,160" fill="#7a5f37"/>
    <circle cx="90" cy="200" r="6" fill="#d4af37" stroke="#8b5a2b" stroke-width="1"/>
    <circle cx="170" cy="200" r="6" fill="#d4af37" stroke="#8b5a2b" stroke-width="1"/>
    <text x="130" y="230" font-family="serif" font-size="30" fill="#d4af37" opacity="0.6" text-anchor="middle">𓂀</text>
  </g>
  
  <!-- Urna ceremonial (lado derecho) -->
  <g opacity="0.7">
    <path d="M 620 200 L 600 180 L 600 160 L 700 160 L 700 180 L 680 200 L 680 280 L 620 280 Z" 
          fill="#a08a70" stroke="#6b5a3f" stroke-width="2"/>
    <ellipse cx="640" cy="160" rx="40" ry="15" fill="#8b7a5f" stroke="#6b5a3f" stroke-width="1"/>
    <text x="650" y="240" font-family="serif" font-size="40" fill="#8b6f47" opacity="0.5" text-anchor="middle">𓂀</text>
  </g>
  
  <!-- Columnas inscriptas -->
  <g opacity="0.5">
    <rect x="30" y="100" width="20" height="280" fill="#6b5a3f" stroke="#4a3a1f" stroke-width="1"/>
    <rect x="750" y="100" width="20" height="280" fill="#6b5a3f" stroke="#4a3a1f" stroke-width="1"/>
    
    <!-- Jeroglíficos en las columnas -->
    <text x="40" y="150" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓂀</text>
    <text x="40" y="200" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓄿</text>
    <text x="40" y="250" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓈖</text>
    <text x="40" y="300" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓂋</text>
    
    <text x="760" y="150" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓂀</text>
    <text x="760" y="200" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓊃</text>
    <text x="760" y="250" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓅓</text>
    <text x="760" y="300" font-family="serif" font-size="20" fill="#d4af37" opacity="0.7">𓋴</text>
  </g>
  
  <!-- Luz mística emanando del sarcófago -->
  <circle cx="400" cy="240" r="150" fill="#d4af37" opacity="0.08"/>
  <circle cx="400" cy="240" r="100" fill="#ffe4a0" opacity="0.05"/>
  
  <!-- Símbolos de protección en piso -->
  <g opacity="0.3" font-family="serif" font-size="50" fill="#d4af37" text-anchor="middle">
    <text x="100" y="380">𓂀</text>
    <text x="400" y="380">𓋔</text>
    <text x="700" y="380">𓂀</text>
  </g>
</svg>
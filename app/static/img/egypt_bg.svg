  <ellipse cx="633" cy="675" rx="3.5" ry="4.5" fill="#6a3a0a"/>
  <!-- nariz/boca -->
  <line x1="614" y1="683" x2="640" y2="683" stroke="#8a5a1a" stroke-width="1.5"/>
  <!-- barba real -->
  <rect x="622" y="698" width="8" height="15" rx="3" fill="#b8862a"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0621"/>
      <stop offset="30%"  stop-color="#1e0d3a"/>
      <stop offset="60%"  stop-color="#6b2210"/>
      <stop offset="80%"  stop-color="#b85820"/>
      <stop offset="100%" stop-color="#e0a030"/>
    </linearGradient>
    <linearGradient id="g_sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d8ad55"/>
      <stop offset="100%" stop-color="#7a5018"/>
    </linearGradient>
    <linearGradient id="g_pyr_main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c09030"/>
      <stop offset="48%"  stop-color="#e8c060"/>
      <stop offset="100%" stop-color="#7a4e10"/>
    </linearGradient>
    <linearGradient id="g_pyr_side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b07820"/>
      <stop offset="48%"  stop-color="#d8a845"/>
      <stop offset="100%" stop-color="#6a3e0e"/>
    </linearGradient>
    <radialGradient id="g_moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffae0"/>
      <stop offset="100%" stop-color="#f5e070"/>
    </radialGradient>
    <radialGradient id="g_moon_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fffae0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fffae0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g_vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="100%" stop-color="#0d0621" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="border_pat" x="0" y="0" width="40" height="22" patternUnits="userSpaceOnUse">
      <polygon points="20,2 38,20 2,20" fill="none" stroke="#c9902a" stroke-width="1.2"/>
      <circle cx="20" cy="12" r="2.5" fill="#c9902a"/>
    </pattern>
  </defs>

  <!-- ── Cielo ── -->
  <rect width="1600" height="900" fill="url(#g_sky)"/>

  <!-- ── Luna ── -->
  <circle cx="1350" cy="130" r="90" fill="url(#g_moon_glow)"/>
  <circle cx="1350" cy="130" r="58"  fill="url(#g_moon)"/>
  <circle cx="1332" cy="116" r="10"  fill="#e8d880" opacity="0.35"/>
